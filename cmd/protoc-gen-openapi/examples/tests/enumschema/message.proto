syntax = "proto3";

package tests.enumschema.message.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/google/gnostic/apps/protoc-gen-openapi/examples/tests/enumschema/message/v1;message";

// Messaging service
service Messaging {
  rpc CreateMessage(Message) returns (Message) {
    option (google.api.http) = {
      post: "/v1/messages"
      body: "*"
    };
  }
}

message Message {
  Kind kind = 1;
}

enum Kind {
  option (openapi.v3.enum_schema) = {
    title: "Kind"
    description: "The kind of thing"
    example: {yaml: "KIND_1"}
    default: {string: "KIND_1"}
  };

  UNKNOWN_KIND = 0;
  KIND_1 = 1;
  KIND_2 = 2;
}
